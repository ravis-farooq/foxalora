# Testing add-on: Mailpit route (included inside the HTTPS server block of nginx.conf.template).
# Behind the password gate like the rest of the site.

# Mailpit web inbox for mail sent to outside addresses. Its own add_header replaces the
# app's headers here, so Mailpit's own Content-Security-Policy applies to its pages.
location /mailpit/ {
    proxy_pass http://mailpit:8025;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header Host $host;
    proxy_set_header Authorization "";
    add_header X-Robots-Tag "noindex, nofollow" always;
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;
}
