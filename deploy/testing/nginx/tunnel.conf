# Cloudflare quick-tunnel add-on (included inside the HTTPS server block of nginx.conf.template).
# The tunnel connects to Nginx as https://web with TLS SNI "web"; accept that name here.
# Browsers still use the public trycloudflare.com host name (DOMAIN), which the API checks.
server_name web;

# Use the visitor's address that Cloudflare passes on, so login throttling is per visitor and
# not per tunnel. Trusted only from the private Docker network the tunnel container is on.
set_real_ip_from 172.16.0.0/12;
set_real_ip_from 10.0.0.0/8;
set_real_ip_from 192.168.0.0/16;
real_ip_header CF-Connecting-IP;
