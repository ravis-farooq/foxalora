# Testing add-on (included inside the HTTPS server block of nginx.conf.template).

# Shared password gate for the whole site. Users and passwords: deploy/testing/gate.sh
auth_basic "Foxalora test";
auth_basic_user_file /etc/nginx/foxalora.d/htpasswd;

# Mailpit web inbox for mail sent to outside addresses. Its own add_header replaces the
# app's headers here, so Mailpit's own Content-Security-Policy applies to its pages.
location /mailpit/ {
    proxy_pass http://mailpit:8025;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header Host $host;
    proxy_set_header Authorization "";
    add_header X-Robots-Tag "noindex, nofollow" always;
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;
}
