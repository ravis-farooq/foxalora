# Minimal Exim 4 configuration for testing Foxalora's SMTP client. Dev only.
primary_hostname = mail.exim.test
domainlist local_domains = exim.test

daemon_smtp_ports = 25 : 465 : 587
tls_on_connect_ports = 465
tls_certificate = /etc/ssl/foxalora/fullchain.pem
tls_privatekey = /etc/ssl/foxalora/server-key.pem
tls_advertise_hosts = *
tls_require_ciphers = SECURE128:-VERS-ALL:+VERS-TLS1.3:+VERS-TLS1.2

# Offer AUTH only inside TLS, like production hosting servers.
auth_advertise_hosts = ${if eq{$tls_in_cipher}{}{}{*}}

acl_smtp_rcpt = acl_check_rcpt
log_file_path = /var/log/exim4/%slog
never_users = root

begin acl
acl_check_rcpt:
  accept authenticated = *
  accept domains = +local_domains
  deny   message = Relay not permitted

begin routers
# The lookups give untainted $domain_data / $local_part_data for the delivery path
# (Exim 4.94+ refuses paths built from the raw recipient address).
local_mailbox:
  driver = accept
  domains = +local_domains
  local_parts = lsearch,ret=key;/etc/exim4/localparts
  transport = maildir_delivery

begin transports
maildir_delivery:
  driver = appendfile
  directory = /var/mail/${domain_data}/${local_part_data}/
  maildir_format
  create_directory
  delivery_date_add
  envelope_to_add
  return_path_add
  user = vmail
  group = vmail
  mode = 0600

begin retry
*  *  F,1h,15m

begin authenticators
dovecot_plain:
  driver = dovecot
  public_name = PLAIN
  server_socket = /run/dovecot/auth-client
  server_set_id = $auth1

dovecot_login:
  driver = dovecot
  public_name = LOGIN
  server_socket = /run/dovecot/auth-client
  server_set_id = $auth1
