# Dovecot 2.3 (Debian bookworm). IMAP only; Exim delivers into the same Maildirs.
protocols = imap
listen = *
log_path = /dev/stderr

ssl = required
ssl_cert = </etc/ssl/foxalora/fullchain.pem
ssl_key = </etc/ssl/foxalora/server-key.pem
ssl_min_protocol = TLSv1.2
disable_plaintext_auth = yes
auth_mechanisms = plain login

mail_location = maildir:/var/mail/%d/%n
first_valid_uid = 5000

passdb {
  driver = passwd-file
  args = scheme=PLAIN username_format=%u /etc/dovecot/users
}
userdb {
  driver = static
  args = uid=vmail gid=vmail home=/var/mail/%d/%n
}

# Exim authenticates SMTP users through this socket.
service auth {
  unix_listener auth-client {
    mode = 0660
    group = Debian-exim
  }
}

namespace inbox {
  inbox = yes
  mailbox Sent {
    special_use = \Sent
    auto = subscribe
  }
  mailbox Drafts {
    special_use = \Drafts
    auto = subscribe
  }
  mailbox Junk {
    special_use = \Junk
    auto = subscribe
  }
  mailbox Trash {
    special_use = \Trash
    auto = subscribe
  }
}
